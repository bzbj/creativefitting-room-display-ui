<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1A85EC">
  <meta name="color-scheme" content="light">
  <title>会议室门牌 · CreativeFitting</title>
  <!-- Bundled Nunito and Quicksand licenses:
{{FONT_LICENSES}}
  -->
  <style>
{{FONT_CSS}}
{{PAGE_CSS}}
  </style>
</head>
<body class="state-unknown" data-room="1" data-api-base="/api" data-layout-report="on">
  <div class="viewport">
    <main class="signage">
      <section class="booking-core" aria-label="会议室预约">
        <header class="topbar">
          <img class="brand-wordmark" src="{{WORDMARK_DATA}}" alt="CreativeFitting">
          <time id="clock">--:--</time>
        </header>
        <div class="room-row">
          <h1 id="room-name">会议室</h1>
          <div class="room-meta"><div>会议室<span id="capacity">-- 人</span></div><span id="room-number">ROOM 01</span></div>
        </div>
        <div class="status-block" role="status" aria-live="polite">
          <span id="status-kicker" class="sr-only">预约状态</span>
          <div class="status-line"><strong id="status-main" class="status-main">状态未知</strong></div>
          <div id="status-support" class="status-support">请查看飞书</div>
        </div>
        <section class="booking-side" aria-labelledby="booking-heading">
          <div class="booking-head"><h2 id="booking-heading">下一场</h2><span id="booking-horizon">正在同步</span></div>
          <div id="booking-list" class="booking-list"><div class="booking-empty"><strong>正在读取预约</strong></div></div>
        </section>
        <footer><span id="today">今天</span><span id="sync-text">正在同步</span></footer>
      </section>
      <section class="question-card" aria-label="换一个好问题">
        <span class="mini-label">THE BETTER QUESTION</span>
        <p id="question-text" class="question-text" aria-live="polite">如果这次讨论
只能做一个决定，
会是什么？</p>
        <span class="question-note">停一下，答案也许就在下一问。</span>
        <button id="question-next" class="question-next" type="button" aria-label="换一句灵感">↗</button>
      </section>
    </main>
  </div>
  <script>
{{SCRIPT}}
  </script>
</body>
</html>
