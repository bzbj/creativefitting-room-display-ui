<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会议屏内容模板</title><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:#f3eccc;color:#272e30;font-family:system-ui,'Microsoft YaHei',sans-serif}.canvas{width:100%;height:100%;padding:28px 32px;display:flex;flex-direction:column;justify-content:center;position:relative}small{color:#857843;font-size:13px;letter-spacing:2px;position:absolute;top:27px}h1{font-size:40px;line-height:1.4;margin:0 62px 18px 0;font-weight:700}p{font-size:18px;color:#8b7d4f;margin:0}button{position:absolute;right:28px;bottom:24px;border:0;border-radius:50%;width:54px;height:54px;background:#272e30;color:#f3eccc;font-size:27px;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #1a85ec;outline-offset:4px}.dot{position:absolute;right:39px;top:72px;width:16px;height:16px;background:#1a85ec;border-radius:50%;animation:breathe 5s ease-in-out infinite}@keyframes breathe{50%{transform:translateY(-8px);opacity:.5}}@media(prefers-reduced-motion:reduce){.dot{animation:none}}
</style></head><body><main class="canvas"><small>A MOMENT OF CURIOSITY</small><i class="dot" aria-hidden="true"></i><h1 id="line">什么证据，<br>会让我们改变主意？</h1><p>轻触一下，换个思考角度。</p><button id="next" aria-label="换一个问题">↗</button></main><script>
// Work only inside the602×382 content viewport; no network or parent-page access.
const lines=['什么证据，<br>会让我们改变主意？','先做一个版本，<br>再让现实回答。','给好奇心，<br>留一个位置。'];let current=0;document.querySelector('#next').addEventListener('click',()=>{current=(current+1)%lines.length;document.querySelector('#line').innerHTML=lines[current]});
</script></body></html>
