name: UI checks

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: python3 scripts/build.py
      - run: python3 -m unittest discover -s tests -v
      - run: node --check src/app.js
